# Cloudflare Pages / Workers Configuration for Scruttin
name = "scruttin"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

# If you configure bindings via Cloudflare Dashboard (Workers & Pages > Settings > Bindings),
# leave the blocks below commented out so the Dashboard has full authority.
#
# Alternatively, if you prefer wrangler.toml as your source of truth:
# uncomment and fill in your real D1 database UUID and bucket name:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "scruttin-d1"
# database_id = "<your-real-d1-uuid>"
#
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "<your-r2-bucket-name>"

[vars]
ENVIRONMENT = "production"
